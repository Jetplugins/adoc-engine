[package]
name = "adoc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native AsciiDoc parser, renderer and publication exports"
repository = "https://github.com/Jetplugins/adoc-engine"
readme = "../../README.md"
[dependencies]
asciidoc-parser = { version = "=0.31.2", path = "../../vendor/asciidoc-parser" }
asciidoc-html5 = { version = "=0.2.3", path = "../../vendor/asciidoc-html5" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
adocers-typst = { version = "=0.3.2", path = "../../vendor/adocers-typst", default-features = false }
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-svg = "0.15"
typst-render = "0.15"
typst-layout = "0.15"
roxmltree = "0.21"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
sha2 = "0.11"
base64 = "0.22"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
mathemascii = "0.4"
typst-pdf = "0.15"
