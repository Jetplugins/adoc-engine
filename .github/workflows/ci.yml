name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with: { python-version: '3.15' }
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: python3 tests/library_consumer.py
      - run: python3 tests/protocol.py target/debug/adoc-engine
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    strategy:
      matrix:
        toolchain: ['1.96.0', '1.99.1']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '${{ matrix.toolchain }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
