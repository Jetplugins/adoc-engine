name: Performance comparison
on: workflow_dispatch
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: gem install asciidoctor -v 2.0.26 --no-document
      - run: npm ci --ignore-scripts
        working-directory: benchmarks
      - run: cargo build --release --locked
      - run: python3 benchmarks/run.py
      - run: python3 benchmarks/exports.py
      - run: python3 benchmarks/lsp.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmarks/results
            benchmarks/baselines/release/exports.json
            benchmarks/baselines/release/lsp.json
