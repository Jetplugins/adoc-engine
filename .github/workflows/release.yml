name: Release verification
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, binary: adoc-engine }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, binary: adoc-engine }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: adoc-engine }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: adoc-engine }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, binary: adoc-engine.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.15' }
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: python tests/protocol.py target/release/${{ matrix.binary }}
      - run: python scripts/font_licenses.py
      - run: python scripts/package.py --target ${{ matrix.target }} --binary target/release/${{ matrix.binary }}
      - run: python scripts/verify_archive.py --execute --expected-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.15' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: curl -fL https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o /tmp/epubcheck.zip && unzip -q /tmp/epubcheck.zip -d /tmp
      - run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '4.0' }
      - run: gem install asciidoctor -v 2.0.26 --no-document
      - run: npm ci --ignore-scripts
        working-directory: benchmarks
      - run: python3 benchmarks/run.py --verify-only --output verification/compatibility
      - run: python tests/publications.py target/release/adoc-engine --epubcheck /tmp/epubcheck-5.4.0/epubcheck.jar
      - uses: actions/upload-artifact@v4
        with:
          name: publication-verification
          path: verification/publication
  draft:
    needs: [build, publication]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "adoc-engine $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md artifacts/*/*.tar.gz artifacts/*/*.zip artifacts/*/*.sha256
